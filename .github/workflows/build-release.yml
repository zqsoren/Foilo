name: Build Linux release
on: workflow_dispatch
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      MY_LIFE_DB_PATH: /tmp/folio-release-build.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked packages and verify the SQLite binary
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node -e "require('better-sqlite3')(':memory:').prepare('SELECT 1').get()"
      - name: Prepare pinned gym thumbnails and animations
        run: python3 scripts/prepare-gym-media.py
      - run: npm test
      - run: npm run typecheck
      - name: Build standalone web application
        run: npm run build
      - name: Prepare archive for the existing standby-slot deployment
        run: |
          set -eu
          stage=.next/standalone
          mkdir -p "$stage/public" "$stage/.next/static"
          cp -a public/. "$stage/public/"
          cp -a .next/static/. "$stage/.next/static/"
          diff -qr public "$stage/public"
          diff -qr .next/static "$stage/.next/static"
          mkdir -p "$stage/node_modules/better-sqlite3/prebuilds"
          cp node_modules/better-sqlite3/prebuilds/linux-x64.node "$stage/node_modules/better-sqlite3/prebuilds/"
          test ! -e "$stage/data"
          test -z "$(find "$stage" -type f \( -name '*.sqlite*' -o -name '.env*' \) -print -quit)"
          (cd "$stage" && node -e "require('better-sqlite3')(':memory:').prepare('SELECT 1').get()")
          export NODE_ENV=production HOSTNAME=127.0.0.1 PORT=3351
          (cd "$stage" && exec node server.js) > "$RUNNER_TEMP/folio-smoke.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --retry 12 --retry-all-errors --retry-delay 1 -sS http://127.0.0.1:3351/api/health >/dev/null
          for device in mobile desktop; do
            ua="Folio desktop smoke"
            if [ "$device" = mobile ]; then ua="Mozilla/5.0 (iPhone; Mobile)"; fi
            curl -sSI -A "$ua" http://127.0.0.1:3351/gym | tr -d '\r' | grep -Fi "location: /login?next=%2Fgym%3Fdevice%3D$device"
          done
          tar -czf "$RUNNER_TEMP/release.tar.gz" -C "$stage" .
          cd "$RUNNER_TEMP"
          sha256sum release.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: folio-linux-x64
          path: |
            ${{ runner.temp }}/release.tar.gz
            ${{ runner.temp }}/SHA256SUMS
          retention-days: 7
